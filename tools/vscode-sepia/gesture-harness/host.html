<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Stand-in for the sheet editor's webview shell (src/sheetEditor.ts):
         loads the PRODUCTION sheet.js bundle unmodified. With no
         acquireVsCodeApi, vscodeApi.ts collects every posted message on
         window.__POSTED__; the project arrives by window.postMessage, as the
         extension host sends it. The window.__* helpers only READ the page. -->
    <title>sepia gesture harness</title>
    <link rel="stylesheet" href="./sheet.css" />
    <style>
      :root { --vscode-editor-background: #1f1f1f; --vscode-sideBar-background: #181818; --vscode-foreground: #ccc; }
      html, body { margin: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.__POSTED__ = [];
      window.__errors = [];
      window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
      window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason)));
      window.__deliver = (msg) => window.postMessage(msg, '*');
      window.__reset = () => { window.__POSTED__.length = 0; };
      const svg = () => document.querySelector('svg[aria-label="sheet"]');
      // Sheet units (1/100 in) to viewport pixels and back.
      window.__toScreen = (x, y) => {
        const m = svg().getScreenCTM();
        const p = new DOMPoint(x, y).matrixTransform(m);
        return { x: p.x, y: p.y };
      };
      window.__toSheet = (x, y) => {
        const m = svg().getScreenCTM().inverse();
        const p = new DOMPoint(x, y).matrixTransform(m);
        return { x: p.x, y: p.y };
      };
      window.__viewBox = () => svg().getAttribute('viewBox');
      window.__center = (sel) => {
        const el = document.querySelector(sel);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      };
      // The drop target and the ghost, in sheet units: what the user sees
      // mid-drag.
      window.__drop = () => {
        const r = document.querySelector('rect.drop');
        return r ? { x: +r.getAttribute('x'), y: +r.getAttribute('y'), w: +r.getAttribute('width'), h: +r.getAttribute('height') } : null;
      };
      window.__ghost = () => document.querySelector('g.ghost')?.getAttribute('transform') ?? null;
      window.__pieces = () => [...document.querySelectorAll('rect.hit.piece')].map((r) => r.getAttribute('aria-label'));
      window.__rowOf = (label) => {
        const el = [...document.querySelectorAll('aside.left .row')].find((x) => x.textContent.replace(/\s+/g, ' ').trim().startsWith(label));
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      };
      window.__right = () => document.querySelector('aside.right')?.innerText ?? '';
      window.__header = () => document.querySelector('header')?.innerText ?? '';
      window.__ink = () => document.querySelectorAll('g.ink:not(.ghost) > *').length;
    </script>
    <script src="./sheet.js"></script>
  </body>
</html>
